<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" fill="none" role="img" aria-labelledby="treeTitle treeDesc">
  <title id="treeTitle">全部会话：工作区 → 状态分组 → 会话的三级树</title>
  <desc id="treeDesc">主区面板显示返回按钮、标题与统计、全部/运行中/待处理/待确认四个筛选标签和搜索框；树体按工作区分叉，每个工作区再按状态分组，会话行前带状态圆点，分组与工作区行带会话计数。</desc>
  <rect x=".5" y=".5" width="1159" height="559" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif">

    <!-- 返回按钮 -->
    <rect x="32" y="24" width="110" height="30" rx="7" fill="none" stroke="#DDE1E7"/>
    <text x="87" y="44" text-anchor="middle" font-size="12.5" fill="#4B5563">← 返回会话</text>

    <!-- 标题与统计 -->
    <text x="160" y="45" font-size="19" font-weight="600" fill="#232A35">全部会话</text>
    <text x="160" y="65" font-size="11.5" fill="#929AA7">2 个工作区 · 10 个会话 · 含已归档</text>

    <!-- 筛选标签 -->
    <rect x="366" y="24" width="352" height="38" rx="8" fill="#EDEEF1"/>
    <rect x="369" y="27" width="76" height="32" rx="6" fill="#FFFFFF" stroke="#E7E9ED"/>
    <text x="382" y="48" font-size="12" fill="#232A35">全部<tspan dx="6" font-size="10" fill="#9AA2AE">10</tspan></text>
    <text x="462" y="48" font-size="12" fill="#6B7280">运行中<tspan dx="6" font-size="10" fill="#9AA2AE">1</tspan></text>
    <text x="554" y="48" font-size="12" fill="#6B7280">待处理<tspan dx="6" font-size="10" fill="#9AA2AE">2</tspan></text>
    <text x="646" y="48" font-size="12" fill="#6B7280">待确认<tspan dx="6" font-size="10" fill="#9AA2AE">4</tspan></text>

    <!-- 搜索框 -->
    <rect x="838" y="24" width="290" height="32" rx="8" fill="#FFFFFF" stroke="#DDE1E7"/>
    <text x="854" y="45" font-size="12" fill="#A1A9B6">搜索项目、路径或会话…</text>

    <!-- 工具条 -->
    <text x="32" y="103" font-size="11" fill="#929AA7">工作区 → 状态 → 会话</text>
    <text x="950" y="103" text-anchor="end" font-size="11" fill="#929AA7">全部展开</text>
    <text x="1010" y="103" font-size="11" fill="#929AA7">全部折叠</text>
    <text x="1128" y="103" text-anchor="end" font-size="11" fill="#929AA7">10 个会话</text>
    <path d="M32 110h1096" stroke="#E9EBEF"/>

    <!-- 连接线：横线一直画到图标前，竖线只覆盖本节点的子树 -->
    <g stroke="#E2E5EA" stroke-width="1">
      <!-- 第 1 层 -->
      <path d="M32 138v228"/>
      <path d="M32 138h24"/>
      <path d="M32 366h24"/>
      <!-- 第 2 层 -->
      <path d="M58 171v156"/>
      <path d="M58 171h24"/>
      <path d="M58 233h24"/>
      <path d="M58 327h24"/>
      <path d="M58 399v94"/>
      <path d="M58 399h24"/>
      <path d="M58 493h24"/>
      <!-- 第 3 层 -->
      <path d="M84 202h26"/>
      <path d="M84 264v32"/>
      <path d="M84 264h26"/>
      <path d="M84 296h26"/>
      <path d="M84 430v32"/>
      <path d="M84 430h26"/>
      <path d="M84 462h26"/>
    </g>

    <!-- 工作区 1 -->
    <path d="M64 139l7 0-3.5 4.5z" fill="#9AA2AE"/>
    <g transform="translate(82 130.5) scale(0.9375)" stroke="#8A93A1" stroke-width="1.3"><path d="M1.8 4.2A1.2 1.2 0 0 1 3 3h3l1.4 1.6H13a1.2 1.2 0 0 1 1.2 1.2v5.4A1.2 1.2 0 0 1 13 12.4H3a1.2 1.2 0 0 1-1.2-1.2Z"/></g>
    <text x="104" y="143" font-size="13.5" font-weight="500" fill="#232A35">DsPlugins</text>
    <text x="184" y="142" font-size="10.5" font-family="ui-monospace,Consolas,monospace" fill="#9AA2AE">E:/DsProjects/DsPlugins</text>
    <rect x="952" y="129" width="66" height="18" rx="9" fill="#E4EBF5"/>
    <text x="985" y="142" text-anchor="middle" font-size="10" fill="#33507E">1 运行中</text>
    <rect x="1026" y="129" width="66" height="18" rx="9" fill="#F7EDD9"/>
    <text x="1059" y="142" text-anchor="middle" font-size="10" fill="#7A5B1E">2 待处理</text>
    <rect x="1100" y="129" width="28" height="18" rx="9" fill="#EDEEF1"/>
    <text x="1114" y="142" text-anchor="middle" font-size="10" fill="#616B7B">7</text>

    <!-- 分组：运行中 -->
    <path d="M90 172l7 0-3.5 4.5z" fill="#9AA2AE"/>
    <circle cx="112" cy="171" r="3.5" fill="#4A6FA5"/>
    <text x="124" y="176" font-size="12.5" fill="#4B5563">运行中</text>
    <text x="172" y="176" font-size="10" fill="#9AA2AE">1</text>

    <circle cx="122" cy="202" r="3" fill="#4A6FA5"/>
    <text x="134" y="207" font-size="13" fill="#232A35">侧聊插件 · 上下文同步优化</text>

    <!-- 分组：待处理 -->
    <path d="M90 234l7 0-3.5 4.5z" fill="#9AA2AE"/>
    <circle cx="112" cy="233" r="3.5" fill="#BF923C"/>
    <text x="124" y="238" font-size="12.5" fill="#4B5563">待处理</text>
    <text x="172" y="238" font-size="10" fill="#9AA2AE">2</text>

    <rect x="110" y="248" width="1018" height="32" rx="8" fill="#EDEEF1"/>
    <circle cx="122" cy="264" r="3" fill="#BF923C"/>
    <text x="134" y="269" font-size="13" fill="#232A35">全局任务 · 三标签拆分与高度拖拽</text>
    <text x="1114" y="269" text-anchor="middle" font-size="11" fill="#9AA2AE">↗</text>

    <circle cx="122" cy="296" r="3" fill="#C0574F"/>
    <text x="134" y="301" font-size="13" fill="#232A35">TokenTracker · 打包脚本修复</text>

    <!-- 分组：已归档（折叠） -->
    <path d="M92 325l4.5 3.5-4.5 3.5z" fill="#9AA2AE"/>
    <circle cx="112" cy="327" r="3.5" fill="#9AA2AE" opacity="0.6"/>
    <text x="124" y="332" font-size="12.5" fill="#4B5563">已归档</text>
    <text x="172" y="332" font-size="10" fill="#9AA2AE">4</text>

    <!-- 工作区 2 -->
    <path d="M64 367l7 0-3.5 4.5z" fill="#9AA2AE"/>
    <g transform="translate(82 358.5) scale(0.9375)" stroke="#8A93A1" stroke-width="1.3"><path d="M1.8 4.2A1.2 1.2 0 0 1 3 3h3l1.4 1.6H13a1.2 1.2 0 0 1 1.2 1.2v5.4A1.2 1.2 0 0 1 13 12.4H3a1.2 1.2 0 0 1-1.2-1.2Z"/></g>
    <text x="104" y="371" font-size="13.5" font-weight="500" fill="#232A35">TokenTrackerLite</text>
    <text x="216" y="370" font-size="10.5" font-family="ui-monospace,Consolas,monospace" fill="#9AA2AE">E:/DsProjects/TokenTrackerLite</text>
    <rect x="1026" y="357" width="66" height="18" rx="9" fill="#DDEBE2"/>
    <text x="1059" y="370" text-anchor="middle" font-size="10" fill="#345D44">2 待确认</text>
    <rect x="1100" y="357" width="28" height="18" rx="9" fill="#EDEEF1"/>
    <text x="1114" y="370" text-anchor="middle" font-size="10" fill="#616B7B">3</text>

    <!-- 分组：待确认 -->
    <path d="M90 400l7 0-3.5 4.5z" fill="#9AA2AE"/>
    <circle cx="112" cy="399" r="3.5" fill="#3D9F72"/>
    <text x="124" y="404" font-size="12.5" fill="#4B5563">待确认</text>
    <text x="172" y="404" font-size="10" fill="#9AA2AE">2</text>

    <circle cx="122" cy="430" r="3" fill="#3D9F72"/>
    <text x="134" y="435" font-size="13" fill="#232A35">轻量版本地版规划</text>

    <circle cx="122" cy="462" r="3" fill="#3D9F72"/>
    <text x="134" y="467" font-size="13" fill="#232A35">工作原理分析</text>

    <!-- 分组：已归档（折叠） -->
    <path d="M92 491l4.5 3.5-4.5 3.5z" fill="#9AA2AE"/>
    <circle cx="112" cy="493" r="3.5" fill="#9AA2AE" opacity="0.6"/>
    <text x="124" y="498" font-size="12.5" fill="#4B5563">已归档</text>
    <text x="172" y="498" font-size="10" fill="#9AA2AE">1</text>

    <text x="32" y="536" font-size="11" fill="#929AA7">点工作区行或状态分组折叠分支；点会话行用原生导航打开，原会话始终保留</text>
  </g>
</svg>
