<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">任务状态流转</title>
  <desc id="desc">运行中的会话在等待用户或失败时进入「待处理」，正常结束时进入「待确认」。待确认经人工确认、待处理经全部清除后都会移出聚合。原会话始终保留；新一轮活动后重新进入聚合。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" stroke="#9099A7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" stroke="#B4BBC6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x=".5" y=".5" width="1099" height="439" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" text-anchor="middle">

    <!-- 运行中 -->
    <rect x="40" y="144" width="240" height="92" rx="12" fill="white" stroke="#DDE1E7"/>
    <text x="160" y="180" font-size="21" font-weight="600" fill="#232A35">运行中</text>
    <text x="160" y="210" font-size="13" fill="#798292">正在执行的会话</text>

    <!-- 待处理 -->
    <path d="M285 178C350 178 360 102 415 102" stroke="#9099A7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="348" y="122" font-size="11" fill="#798292">等待用户／失败</text>
    <rect x="420" y="56" width="240" height="92" rx="12" fill="#FFFBF2" stroke="#EADFC8"/>
    <text x="540" y="92" font-size="21" font-weight="600" fill="#7A5B1E">待处理</text>
    <text x="540" y="122" font-size="13" fill="#8A7752">待审批 · 待输入 · 运行失败</text>

    <!-- 待确认 -->
    <path d="M285 202C350 202 360 278 415 278" stroke="#9099A7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="348" y="268" font-size="11" fill="#798292">正常结束</text>
    <rect x="420" y="232" width="240" height="92" rx="12" fill="white" stroke="#DDE1E7"/>
    <text x="540" y="268" font-size="21" font-weight="600" fill="#232A35">待确认</text>
    <text x="540" y="298" font-size="13" fill="#798292">已跑完，等你点 ✓</text>

    <!-- 待处理 → 移出聚合 -->
    <path d="M665 102C730 102 740 178 795 178" stroke="#B4BBC6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"/>
    <text x="726" y="122" font-size="11" fill="#8C95A3">全部清除</text>

    <!-- 待确认 → 移出聚合 -->
    <path d="M665 278C730 278 740 202 795 202" stroke="#9099A7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="726" y="268" font-size="11" fill="#798292">手动 ✓</text>

    <!-- 移出聚合 -->
    <rect x="800" y="144" width="240" height="92" rx="12" fill="#F0F6F2" stroke="#D6E3DA"/>
    <text x="920" y="180" font-size="21" font-weight="600" fill="#345D44">移出聚合</text>
    <text x="920" y="210" font-size="13" fill="#64816E">原会话保留 · 不等同于归档</text>

    <!-- 回流：新一轮活动（从卡片区下方绕回，不穿过任何卡片） -->
    <path d="M920 240v112H160v-108" stroke="#B4BBC6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"/>
    <text x="540" y="372" font-size="11" fill="#8C95A3">新一轮活动后重新出现</text>

    <text x="550" y="410" font-size="13" fill="#657080">三个标签互斥；只有「待确认」会随任务完成逐条累积，所以它单独一个标签</text>
  </g>
</svg>
